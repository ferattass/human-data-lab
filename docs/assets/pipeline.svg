<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d">
  <title id="t">Roundtrip gözlem noktaları</title>
  <desc id="d">Yazılan değer forma girer, kaydedilir, yeni oturumda okunur. "Ayşe 🙂" eski utf8mb3 tabloda boş geri gelir; ilk sapma taze okumada işaretlenir.</desc>
  <style>
    .sans{font-family:"Segoe UI",ui-sans-serif,-apple-system,Roboto,Helvetica,Arial,sans-serif}
    .serif{font-family:Georgia,"Iowan Old Style","Times New Roman",serif}
    .mono{font-family:Consolas,ui-monospace,SFMono-Regular,Menlo,"Liberation Mono",monospace}
    .node circle{fill:#FFFFFF;stroke:#D9DAD1;stroke-width:2}
    .n1 circle{animation:lit 8s infinite;animation-delay:.0s}
    .n2 circle{animation:lit 8s infinite;animation-delay:1.6s}
    .n3 circle{animation:lit 8s infinite;animation-delay:3.2s}
    .n4 circle{animation:fail 8s infinite}
    @keyframes lit{0%{stroke:#D9DAD1}3%,100%{stroke:#47705C}}
    @keyframes fail{0%,60%{stroke:#D9DAD1;fill:#FFFFFF}63%,96%{stroke:#B14535;fill:#F7E6E1}100%{stroke:#D9DAD1;fill:#FFFFFF}}
    .val{animation:show 8s infinite both}
    .v1{animation-delay:0s}.v2{animation-delay:1.6s}.v3{animation-delay:3.2s}
    .v4{animation:show4 8s infinite both}
    @keyframes show{0%{opacity:0;transform:translateY(8px)}4%,96%{opacity:1;transform:none}100%{opacity:0}}
    @keyframes show4{0%,60%{opacity:0;transform:translateY(8px)}64%,96%{opacity:1;transform:none}100%{opacity:0}}
    .verdict{animation:show4 8s infinite both}
    .lineprog{stroke-dasharray:900;animation:draw 8s infinite linear}
    @keyframes draw{0%{stroke-dashoffset:900}62%,100%{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1200" height="330" rx="20" fill="#F6F3EB"/>
  <rect x=".5" y=".5" width="1199" height="329" rx="20" fill="none" stroke="#D9DAD1"/>
  <text x="48" y="54" class="serif" font-size="22" font-weight="700" fill="#202A27">Bir roundtrip, ayrı tutulan gözlem noktaları</text>
  <text x="48" y="82" class="sans" font-size="15" fill="#65706B">Kabul ile korunma ayrı değerlendirilir; rapor ilk sapmanın nerede olduğunu söyler.</text>

  <line x1="190" y1="160" x2="1010" y2="160" stroke="#D9DAD1" stroke-width="4" stroke-linecap="round"/>
  <line class="lineprog" x1="190" y1="160" x2="1010" y2="160" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
  <defs><linearGradient id="g" x1="190" x2="1010" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#47705C"/><stop offset=".7" stop-color="#47705C"/><stop offset="1" stop-color="#B14535"/></linearGradient></defs>
  <circle r="7" fill="#202A27">
    <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.62;1" calcMode="linear" path="M190,160 H1010"/>
  </circle>

  <g class="sans" font-size="13" fill="#65706B" text-anchor="middle" letter-spacing=".08em">
    <g class="node n1"><circle cx="190" cy="160" r="38"/><text x="190" y="165" fill="#202A27" font-size="20">✎</text><text x="190" y="226">YAZILAN</text><text x="190" y="244" font-size="11" fill="#65706B">authored</text></g>
    <g class="node n2"><circle cx="463" cy="160" r="38"/><text x="463" y="166" fill="#202A27" font-size="20">⌨</text><text x="463" y="226">FORMA GİREN</text><text x="463" y="244" font-size="11" fill="#65706B">injected</text></g>
    <g class="node n3"><circle cx="736" cy="160" r="38"/><text x="736" y="166" fill="#202A27" font-size="20">⛁</text><text x="736" y="226">KAYDET → 200 OK</text><text x="736" y="244" font-size="11" fill="#65706B">applicationOutcome</text></g>
    <g class="node n4"><circle cx="1010" cy="160" r="38"/><text x="1010" y="166" fill="#202A27" font-size="20">↻</text><text x="1010" y="226">TAZE OKUMA</text><text x="1010" y="244" font-size="11" fill="#65706B">readback · yeni oturum</text></g>
  </g>

  <g class="mono" font-size="15" text-anchor="middle">
    <g class="val v1"><rect x="130" y="96" width="120" height="28" rx="6" fill="#EDEDE3"/><text x="190" y="115" fill="#202A27">"Ayşe 🙂"</text></g>
    <g class="val v2"><rect x="403" y="96" width="120" height="28" rx="6" fill="#EDEDE3"/><text x="463" y="115" fill="#202A27">"Ayşe 🙂"</text></g>
    <g class="val v3"><rect x="641" y="96" width="190" height="28" rx="6" fill="#EDEDE3"/><text x="736" y="115" fill="#47705C">"New user created"</text></g>
    <g class="val v4"><rect x="960" y="96" width="100" height="28" rx="6" fill="#F7E6E1" stroke="#B14535"/><text x="1010" y="115" fill="#B14535">""</text></g>
  </g>
  <g class="verdict sans">
    <rect x="300" y="270" width="600" height="38" rx="19" fill="#F7E6E1" stroke="#B14535" stroke-opacity=".6"/>
    <text x="600" y="295" text-anchor="middle" font-size="15" fill="#B14535">ilk sapma: <tspan class="mono" fill="#B14535">readback</tspan> · başarı mesajı + boş alan = sessiz veri kaybı</text>
  </g>
</svg>
