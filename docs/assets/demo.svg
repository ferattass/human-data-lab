<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d">
  <title id="t">hdl demo</title>
  <desc id="d">hdl demo dört senaryo çalıştırır: doğru mod exit 0, A işaret kaybı exit 1, B izinli NFC eşdeğerliği exit 0, C red ve oturum engeli exit 2. Sentetik demo; hatalar bilerek eklenmiştir.</desc>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:15px}
    .l{opacity:0;animation:show 16s infinite both}
    @keyframes show{0%{opacity:0;transform:translateX(-6px)}3%,94%{opacity:1;transform:none}100%{opacity:0}}
    .d1{animation-delay:.3s}.d2{animation-delay:1.1s}.d3{animation-delay:1.9s}.d4{animation-delay:2.7s}.d5{animation-delay:3.5s}.d6{animation-delay:4.3s}
    .d7{animation-delay:5.1s}.d8{animation-delay:5.9s}.d9{animation-delay:6.7s}.d10{animation-delay:7.5s}.d11{animation-delay:8.3s}.d12{animation-delay:9.1s}
    @media (prefers-reduced-motion:reduce){.l{animation:none;opacity:1}}
  </style>
  <rect width="1200" height="470" rx="16" fill="#0a0f1a"/>
  <rect x=".5" y=".5" width="1199" height="469" rx="16" fill="none" stroke="#1f2a44"/>
  <rect width="1200" height="44" rx="16" fill="#111827"/><rect y="28" width="1200" height="16" fill="#111827"/>
  <circle cx="28" cy="22" r="6" fill="#fb7185"/><circle cx="48" cy="22" r="6" fill="#fbbf24"/><circle cx="68" cy="22" r="6" fill="#4ade80"/>
  <text x="600" y="27" text-anchor="middle" fill="#64748b" font-size="13">human-data-lab — npm run demo</text>

  <g class="l d1"><text x="36" y="86" fill="#2dd4bf" font-weight="700">$</text><text x="56" y="86" fill="#e2e8f0">npx hdl demo</text></g>
  <g class="l d2"><text x="36" y="118" fill="#fbbf24">SENTETİK: hatalar demo uygulamasına bilerek eklenmiştir; dış projede doğrulanmış bulgu değildir.</text></g>

  <g class="l d3"><text x="36" y="160" fill="#94a3b8">── Doğru mod                               profile-demo@0.1.0</text></g>
  <g class="l d4"><text x="56" y="186" fill="#cbd5e1">24 deneme · 0 required ihlal · teknik kontrol doğru reddedildi · cleanup 24/24</text><text x="1100" y="186" fill="#4ade80" font-weight="700" text-anchor="end">exit 0</text></g>

  <g class="l d5"><text x="36" y="226" fill="#94a3b8">── A / Başarı mesajının arkasındaki kayıp   +strip-marks</text></g>
  <g class="l d6"><text x="56" y="252" fill="#cbd5e1">"İpek Çağlar" → "Ipek Caglar"  stable 3/3 · küçültüldü → "İ"</text><text x="1100" y="252" fill="#fb7185" font-weight="700" text-anchor="end">exit 1</text></g>

  <g class="l d7"><text x="36" y="292" fill="#94a3b8">── B / Farklı kod noktası, izinli eşdeğerlik  +nfc</text></g>
  <g class="l d8"><text x="56" y="318" fill="#cbd5e1">text.nfc.v1 geçti · tanısal exact: ham fark görünür (José NFD → NFC)</text><text x="1100" y="318" fill="#4ade80" font-weight="700" text-anchor="end">exit 0</text></g>

  <g class="l d9"><text x="36" y="358" fill="#94a3b8">── C / Red, ihlal ve yürütme engeli         +session-expire:2</text></g>
  <g class="l d10"><text x="56" y="384" fill="#cbd5e1">NUL içeren ad reddedildi ✓ · Ayse Kaya korundu ✓ · 3. deneme: oturum engeli (target)</text><text x="1100" y="384" fill="#fbbf24" font-weight="700" text-anchor="end">exit 2</text></g>

  <g class="l d11"><text x="36" y="426" fill="#4ade80">✓ Dört senaryo da beklenen sonucu verdi.</text></g>
  <g class="l d12"><text x="36" y="452" fill="#64748b">raporlar: runs/demo/{ok,a,b,c}/run-*/report.html</text></g>
</svg>
