<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">human-data-lab</title>
  <desc id="d">İnsan adları formdan veritabanına ve geri okumaya akar; bazıları yolda bozulur.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#131c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".18"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="400" rx="20"/></clipPath>
  </defs>
  <style>
    .sans{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .chip{animation:flow 14s linear infinite}
    .chip rect{fill:#0f1a2e;stroke:#2dd4bf;stroke-width:1.5}
    .chip text{fill:#e2e8f0;font-size:17px}
    .bad rect{animation:turn 14s linear infinite;animation-delay:inherit}
    .bad .x{animation:mark 14s linear infinite;animation-delay:inherit}
    .ok .v{animation:mark 14s linear infinite;animation-delay:inherit}
    @keyframes flow{0%{transform:translateX(-180px);opacity:0}4%{opacity:1}94%{opacity:1}100%{transform:translateX(1260px);opacity:0}}
    @keyframes turn{0%,62%{stroke:#2dd4bf;fill:#0f1a2e}66%,100%{stroke:#fb7185;fill:#2a1220}}
    @keyframes mark{0%,74%{opacity:0}78%,100%{opacity:1}}
    .cursor{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .stage rect{fill:#0d1628;stroke:#334155;stroke-dasharray:4 5}
    .stage text{fill:#94a3b8;font-size:13px;letter-spacing:.12em}
    .pulse{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation-play-state:paused!important}.cursor{animation:none}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>
    <rect width="1200" height="400" fill="url(#glow)"/>

    <text x="60" y="104" class="sans" font-size="58" font-weight="800" fill="#f8fafc">human-<tspan fill="url(#accent)">data</tspan>-lab</text>
    <text x="62" y="146" class="sans" font-size="22" fill="#94a3b8">Formdan geçen insan metni geri geldiğinde hâlâ aynı mı?<tspan class="cursor" fill="#2dd4bf"> ▍</tspan></text>
    <g class="mono" font-size="14" fill="#64748b">
      <text x="62" y="184">99 fixture · 42 kabul senaryosu · exact + açık NFC oracle · Chromium · Apache-2.0</text>
    </g>

    <!-- aşamalar -->
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#1e293b" stroke-width="2"/>
    <g class="stage sans">
      <rect x="250" y="236" width="170" height="128" rx="14"/><text x="335" y="384" text-anchor="middle">FORM</text>
      <rect x="560" y="236" width="170" height="128" rx="14"/><text x="645" y="384" text-anchor="middle">VERİTABANI</text>
      <rect x="870" y="236" width="170" height="128" rx="14"/><text x="955" y="384" text-anchor="middle">TAZE OKUMA</text>
    </g>
    <circle class="pulse" cx="645" cy="248" r="4" fill="#2dd4bf"/>
    <circle class="pulse" cx="955" cy="248" r="4" fill="#2dd4bf" style="animation-delay:-1.4s"/>

    <!-- akan adlar: negatif gecikme ile şerit baştan dolu başlar -->
    <g class="mono">
      <g class="chip ok" style="animation-delay:0s"><rect x="0" y="281" width="150" height="38" rx="19"/><text x="20" y="306">Işık Yıldız</text><text class="v" x="128" y="306" fill="#2dd4bf">✓</text></g>
      <g class="chip bad" style="animation-delay:-2.33s"><rect x="0" y="281" width="150" height="38" rx="19"/><text x="20" y="306">Ayşe 🙂</text><text class="x" x="128" y="306" fill="#fb7185">✗</text></g>
      <g class="chip ok" style="animation-delay:-4.66s"><rect x="0" y="281" width="150" height="38" rx="19"/><text x="20" y="306">王小明</text><text class="v" x="128" y="306" fill="#2dd4bf">✓</text></g>
      <g class="chip bad" style="animation-delay:-7s"><rect x="0" y="281" width="150" height="38" rx="19"/><text x="20" y="306">&#x130;pek</text><text class="x" x="128" y="306" fill="#fb7185">✗</text></g>
      <g class="chip ok" style="animation-delay:-9.33s"><rect x="0" y="281" width="150" height="38" rx="19"/><text x="20" y="306">José Muñoz</text><text class="v" x="128" y="306" fill="#2dd4bf">✓</text></g>
      <g class="chip bad" style="animation-delay:-11.66s"><rect x="0" y="281" width="150" height="38" rx="19"/><text x="20" y="306">Jose&#x301; ·NFD</text><text class="x" x="128" y="306" fill="#fb7185">✗</text></g>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="20" fill="none" stroke="#1f2a44"/>
</svg>
