name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Chromium (Linux, sistem bağımlılıklarıyla)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Chromium
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      - name: Tip denetimi
        run: npm run typecheck
      - name: Kabul matrisi, mimari, şema, Playwright entegrasyonu, paket
        run: npm test
      - name: Araştırma araçları (deneysel)
        run: npm run test:research
      - name: Demo (dört senaryo beklenen çıkış kodlarını vermeli)
        if: runner.os == 'Linux' && matrix.node == 24
        run: npm run demo
      - name: Demo raporlarını sakla
        if: always() && runner.os == 'Linux' && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: demo-reports
          path: runs/demo/**/report.html
          if-no-files-found: ignore
